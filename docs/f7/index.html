  --f-body:-apple-system,"SF Pro Text",system-ui,sans-serif;
  --ease:cubic-bezier(.25,.8,.25,1);
  --f7-theme-color:#007AFF; --f7-theme-color-rgb:0,122,255;
}
.dark{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --line:#38383A; --fg:#FFFFFF; --muted:#8D8D93;
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.18);
  --ss0:#BF5AF2; --ss1:#40C8E0; --ss2:#FF9F0A; --done:#30D158; --done-ink:#000000; --done-soft:rgba(48,209,88,.18);
  --ring:#48484A; --warn:#FF9F0A; --warn-ink:#000000; --danger:#FF453A; --gold:#0A84FF; --win:#FFD60A;
  --scrim:rgba(0,0,0,.55); --body:#3A3A3C;
  --f7-theme-color:#0A84FF; --f7-theme-color-rgb:10,132,255;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
button{width:auto;font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;color:inherit}
.muted{color:var(--muted)} .sm{font-size:13px}
.num-t{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;flex:none}
.empty{color:var(--muted);text-align:center;padding:28px 16px;margin:0}
b,strong{font-weight:600}
h2,h3,h4{margin:0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}

/* buttons used inside sheets and the workout (Framework7 buttons everywhere else) */
.btn{height:44px;padding:0 16px;border-radius:var(--r);font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn.sm{height:34px;padding:0 12px;font-size:15px}
.btn.pri,.btn.done{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface-2);color:var(--fg)}
.btn.ghost{color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sec.danger{background:var(--danger);color:#FFFFFF}
.btn.wide{width:100%}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:999px;color:var(--accent);background:var(--surface-2);flex:none}
.icon-btn.sm{width:30px;height:30px}
.btn:active,.icon-btn:active{opacity:.6}

/* tab bar icons */
.tabbar .tab-link .ic{width:26px;height:26px}
.tabbar .tab-link .tabbar-label{font-size:10px;font-weight:500}

/* large title rows: a small summary on the right of the big title */
.navbar .right .navtxt{color:var(--muted);font-size:15px;padding-right:4px;font-variant-numeric:tabular-nums}

/* lists: body maps and photos as row media */
.list .item-media .bmap{height:44px;gap:3px}
.list .item-media .thumb{width:44px;height:44px}
.list .item-media .thumb.photo{width:48px;height:48px}
.list .item-title-row .item-after .ic{width:18px;height:18px}
.list .item-text{-webkit-line-clamp:2}
.list .item-subtitle{color:var(--muted);font-size:15px}
.wkdone .item-title{color:var(--muted)}
.ckmark{color:var(--accent);display:inline-flex}
.ckmark .ic{width:20px;height:20px}
.tagpill{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:var(--r-in);background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;vertical-align:2px}
.prtag{font-style:normal;display:inline-block;padding:1px 6px;border-radius:var(--r-in);background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.02em;margin-left:6px;vertical-align:1px}
.block-title.bt-row{display:flex;align-items:flex-end;justify-content:space-between}
.block-title .bt-link{text-transform:none;font-size:17px;font-weight:400;color:var(--accent);margin-top:-3px;display:inline-flex;align-items:center;gap:2px;letter-spacing:0}
.block-title .bt-link .ic{width:18px;height:18px}
.block-strong.inset{margin-top:8px}

/* the in-progress workout, at the top of the Lift tab */
.nowcard{padding:16px}
.nowcard .nc-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nowcard .nc-tag{color:var(--accent);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.nowcard .nc-clock{font:600 34px/1.05 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px}
.nowcard .nc-name{font-size:17px;font-weight:600}
.nowcard .nc-sub{color:var(--muted);font-size:15px}
.nowcard .nc-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:12px 0 14px}
.nowcard .nc-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.nowcard .nc-btns{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.nowcard .bmap{height:64px;gap:5px}

/* the in-progress bar above the tab bar on other tabs */
.mini{position:fixed;left:8px;right:8px;z-index:5000;bottom:calc(var(--f7-toolbar-height, 50px) + var(--f7-safe-area-bottom, env(safe-area-inset-bottom, 0px)) + 8px)}
.mini .in{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border-radius:var(--r);text-align:left;color:var(--fg);background:rgba(250,250,250,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 6px 24px rgba(0,0,0,.18),inset 0 0 0 .5px rgba(0,0,0,.08)}
.dark .mini .in{background:rgba(44,44,46,.86);box-shadow:0 6px 24px rgba(0,0,0,.5),inset 0 0 0 .5px rgba(255,255,255,.1)}
.mini .grow{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .t{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.has-mini .page-content{padding-bottom:calc(var(--f7-page-toolbar-bottom-offset, 50px) + var(--f7-safe-area-bottom, 0px) + 72px)}

/* History */
.calcard{padding:12px 12px 14px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calhead h3{font-size:17px;font-weight:600}
.calhead .icon-btn{background:none;width:36px;height:36px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;text-align:center}
.cal .dow{font-size:12px;font-weight:600;color:var(--muted);padding-bottom:4px}
.cal .d{width:34px;height:34px;margin:0 auto;display:grid;place-items:center;border-radius:999px;font-size:17px;font-variant-numeric:tabular-nums}
.cal .d.on{background:var(--accent);color:#FFFFFF;font-weight:600}
.cal .d.today:not(.on){color:var(--accent);font-weight:600}
.streak{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:.5px solid var(--line);text-align:center}
.stat .k{font-size:12px;color:var(--muted);font-weight:400}
.stat .v{font:600 22px/1.2 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.hrow-lines{display:block;margin-top:2px;color:var(--muted);font-size:15px;line-height:1.35}
.hrow-lines span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* finished workout page */
.wpg-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wpg-head .bmap{height:44px;gap:4px}
.wpg-date{color:var(--muted);font-size:15px}
.wpg-stats{display:flex;text-align:center}
.wpg-stats > div{flex:1;min-width:0;padding:4px 2px}
.wpg-stats .v{font:600 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.wpg-stats .k{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.wpg-stats .gold .v,.wpg-stats .gold .k{color:var(--accent)}
.wpr-big{font:600 20px/1.2 var(--f-display);font-variant-numeric:tabular-nums;color:var(--fg)}
.wpr-big small{font-size:15px;color:var(--muted);font-weight:400}
.wpr-big i{font-style:normal;color:var(--muted)}

/* exercise page */
.recgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reptable{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}
.reptable span{display:block;font-size:12px;color:var(--muted)}
.reptable b{font-variant-numeric:tabular-nums}
.dtable .dr{display:grid;grid-template-columns:30px 1fr auto;gap:8px;padding:3px 0;font-variant-numeric:tabular-nums}
.t-w{color:var(--warn)} .t-d{color:var(--ss0)} .t-f{color:var(--danger)}
.note{color:var(--muted);font-size:15px;margin:6px 0 0;white-space:pre-line}

/* Progress */
.goaldots{display:flex;gap:6px;margin-top:8px}
.goaldots i{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.goaldots i.on{background:var(--accent)}
.bars{display:grid;gap:10px}
.mbar{display:grid;grid-template-columns:88px 1fr 32px;align-items:center;gap:10px;font-size:15px}
.mbar .lbl{text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar .track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.mbar .fill{height:100%;background:var(--accent);border-radius:4px}
.mbar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart .gl{stroke:var(--line);stroke-width:.5}
.chart .tl{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dt{fill:var(--accent)}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .vl{fill:var(--fg);font-size:11px;font-weight:600;font-family:var(--f-body)}
.chart .bar{fill:var(--accent);opacity:.45}
.chart .bar.cur{opacity:1}
.bigline{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.bigline h2{font:600 34px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.bigline h2 small{font-size:17px;color:var(--muted);font-weight:400}

/* segmented controls with our own actions */
.seg{display:flex;background:var(--surface-2);border-radius:var(--r);padding:2px;gap:0}
.seg button{flex:1;min-width:0;height:30px;border-radius:var(--r-in);font-weight:400;font-size:13px;color:var(--fg);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.dark .seg button[aria-pressed="true"]{background:#636366}
.mchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{flex:none;height:30px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:15px;font-weight:400;color:var(--fg);text-transform:capitalize}
.mchip[aria-pressed="true"]{background:var(--accent);color:#FFFFFF}
.search{display:flex;align-items:center;gap:6px;height:36px;padding:0 8px;border-radius:var(--r);background:var(--surface-2);color:var(--muted);margin-bottom:10px}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;color:var(--fg);outline:none}
.search .ic{width:18px;height:18px}

/* plate inventory rows in Settings */
.invp{width:44px;flex:none;border-radius:var(--r-in);display:grid;place-items:center;font:600 13px/1 var(--f-body);color:#FFFFFF;font-variant-numeric:tabular-nums}
.invp.light{color:#1B1D22}
.invp.edge{box-shadow:inset 0 0 0 1px rgba(128,128,128,.55)}
.zero .invp{opacity:.3}
.ckey{display:inline-flex;align-items:center;gap:8px;font:600 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;color:var(--fg)}
.ckey .ic{width:18px;height:18px;color:var(--accent)}
.buildno{color:var(--muted);font-size:12px;text-align:center;margin:18px 0 0;opacity:.7}

/* bottom sheets: our content inside a Framework7 sheet */
.lift-sheet{height:auto;max-height:90%;--f7-sheet-bg-color:var(--surface);border-radius:13px 13px 0 0;overflow:hidden}
.lift-sheet .sheet-modal-inner{max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#sheet{padding:6px 16px calc(24px + env(safe-area-inset-bottom, 0px) + var(--kb, 0px))}
.sh-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 4px;min-height:36px}
.sh-title h3{font-size:20px;font-weight:600}
.sh-sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field > span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.inp{width:100%;height:44px;border:0;border-radius:var(--r);background:var(--surface-2);padding:0 12px;font-size:17px;color:var(--fg);outline:none}
textarea.inp{height:88px;padding:10px 12px;resize:none}
select.inp{-webkit-appearance:none;appearance:none}
.check-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:17px}
.check-row input{width:22px;height:22px;accent-color:var(--accent)}
.xrow{display:flex;align-items:center;gap:12px;width:100%;padding:8px 0;text-align:left;border-bottom:.5px solid var(--line)}
.xrow:last-child{border-bottom:0}
.xrow .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.xrow .nm{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xrow .meta{font-size:15px;color:var(--muted);text-transform:capitalize}
.xrow .rt{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.xrow .tick{width:24px;height:24px;border-radius:var(--r);border:1.5px solid var(--ring);display:grid;place-items:center;color:transparent}
.xrow .tick .ic{width:15px;height:15px}
.xrow[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
.grouphead{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin:14px 0 2px}
.sheet-foot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom, 0px));background:var(--surface);display:flex;gap:8px;padding:12px 0 calc(24px + env(safe-area-inset-bottom, 0px));margin-bottom:calc(-24px - env(safe-area-inset-bottom, 0px))}
.sheet-foot .btn{flex:1}
.restgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.restgrid button{height:48px;border-radius:var(--r);background:var(--surface-2);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.restgrid button[aria-pressed="true"]{background:var(--accent);color:#FFFFFF}
.sulbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;padding-top:14px}
.wtime{display:grid;grid-template-columns:1.25fr 1.2fr .75fr;gap:8px}
.wtime label{display:grid;gap:4px;min-width:0}
.wtime span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.wtime .inp{min-width:0;padding:0 8px;font-size:15px}
.title-in{width:100%;border:0;background:transparent;font:600 34px/1.2 var(--f-body);padding:4px 0 8px;outline:none;color:var(--fg)}
.title-in::placeholder{color:var(--muted)}

/* the live workout and the editors open as a full-screen popup */
.popup-wk{--f7-popup-tablet-width:100%;--f7-popup-tablet-height:100%}
.wkh-clk{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:0 16px}
.wkh-big{font:600 34px/1 var(--f-display);font-variant-numeric:tabular-nums;padding:0;text-align:left;color:var(--fg)}
.wkh-big.paused{color:var(--accent)}
.wkh-cnt{display:flex;align-items:baseline;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.wkh-cnt b{font:600 22px/1 var(--f-display)}
.wkh-cnt b i{font-style:normal;color:var(--muted)}
.wkh-cnt small{font-size:13px;font-weight:400;color:var(--muted)}
#wkb{padding:8px 16px 140px}
.wk-actions{display:grid;gap:8px;margin-top:16px}
.toast{--f7-toast-bg-color:rgba(30,30,32,.92)}
.popup-wk .restbar{z-index:5001}
.popup-wk .wrail{z-index:600}
.cf-card{display:grid;gap:2px;padding:14px 16px;border-radius:var(--r);background:var(--accent);color:#FFFFFF;margin-bottom:12px}
.cf-card .hero-tag{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.cf-card .hero-name{font-size:17px;font-weight:600}
.cf-card .hero-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.cf-btns{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}

.lift-toast{pointer-events:none}


/* Exercise blocks */
.exb{padding-block:16px;border-bottom:1px solid var(--line)}
.exb.ss-join{padding-top:6px}
.exh{display:flex;align-items:center;gap:6px}
.exname{flex:1;min-width:0;text-align:left;font-size:17px;font-weight:600;color:var(--accent);line-height:1.25}
.sschip{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:var(--r-in);padding:2px 6px;flex:none}
.exnote{width:100%;border:0;background:transparent;resize:none;font-size:15px;color:var(--fg);padding:4px 0;min-height:28px;field-sizing:content;line-height:1.35}
.exnote::placeholder{color:var(--muted)}
.exmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:var(--r);background:var(--surface-2);font-size:13px;font-weight:600;color:var(--fg)}
.pill .ic{width:15px;height:15px;color:var(--muted)}
.sets{display:grid;gap:4px;margin-top:10px}
.srow{display:grid;grid-template-columns:32px minmax(0,1fr) 92px 58px 40px;gap:6px;align-items:center;border-radius:var(--r);padding:3px 4px;transition:background .15s}
.srow.rpe{grid-template-columns:30px minmax(0,1fr) 84px 50px 46px 40px}
.srow.r{grid-template-columns:32px minmax(0,1fr) minmax(0,1fr) 34px}
.srow.head{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-block:0}
.srow.head span:not(:nth-child(2)){text-align:center}
.srow.done{background:var(--done-soft)}
.stype{height:34px;border-radius:var(--r-in);font-weight:600;font-variant-numeric:tabular-nums}
.t-w{color:var(--muted)} .t-d{color:var(--accent)} .t-f{color:var(--danger)}
.prev{height:34px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-align:left;min-width:0;overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums}
.prev span{overflow:hidden;text-overflow:ellipsis}
.prtag{flex:none;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--gold);border:1px solid currentColor;border-radius:4px;padding:0 4px;line-height:15px}
.num{width:100%;height:36px;border:0;border-radius:8px;background:var(--surface-2);text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:17px;padding:0 4px;-webkit-appearance:none;appearance:none}
.num::placeholder{color:var(--muted);font-weight:400}
.done .num{background:transparent}
.wcell{position:relative;min-width:0}
.wcell.has-pl .num{padding-right:24px}
.pl{position:absolute;right:1px;top:0;height:36px;width:26px;display:grid;place-items:center;color:var(--muted)}
.pl .ic{width:17px;height:17px}
.bw{display:block;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.chk{width:40px;height:34px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.done .chk{background:var(--done);color:var(--done-ink)}
.addset{margin-top:6px;width:100%;height:36px;border-radius:8px;background:var(--surface-2);font-weight:600;font-size:15px;color:var(--muted)}
.wk-actions{display:grid;gap:8px;margin-top:20px}
.exc{position:relative;background:var(--surface);border:0;border-radius:var(--r);padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:12px}
.exc.now{}
/* finished exercises dim under a see-through layer (not opacity: Safari fades only part of a card when it has animated pictures inside); taps pass through to fix a set */
.exc.fin::after{content:'';position:absolute;inset:0;border-radius:inherit;background:rgba(13,15,18,.55);background:color-mix(in srgb, var(--bg) 58%, transparent);pointer-events:none;z-index:2}
.exc.fin .thumb.photo img.f2{animation:none;opacity:0}
.exc.ss-join{margin-top:4px}
.exc.ssg{gap:14px}
.ss-lbl{display:flex;align-items:center;gap:6px;margin:0 -12px;padding:7px 12px;background:var(--ssc);color:var(--bg);font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.ss-lbl .ic{width:16px;height:16px}
.ss-hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}
.exc.ssg{--ssbg:var(--surface)}
.ss-head{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:-2px}
.ss-head .ic{width:16px;height:16px}
.ss-head span{margin-left:auto;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none}
.ss-link{position:relative;height:24px;margin:-6px 0;display:grid;place-items:center;color:var(--accent)}
.ss-link::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1.5px dashed color-mix(in srgb, var(--accent) 45%, transparent)}
.ss-link .ic{position:relative;width:16px;height:16px;padding:4px;box-sizing:content-box;border-radius:50%;background:var(--ssbg, var(--surface))}
.thumbbtn{position:relative}
.ssb{position:absolute;top:-6px;left:-6px;min-width:20px;height:20px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;display:grid;place-items:center;box-shadow:0 0 0 2px var(--ssbg, var(--surface))}
.ssi{display:grid;gap:12px}
.exc-h{display:flex;align-items:flex-start;gap:12px}
.exc-t{flex:1;min-width:0;padding-top:2px}
.exc-n{display:block;text-align:left;font-weight:600;font-size:17px;line-height:1.25;color:var(--fg)}
.exc-s{font-size:13px;color:var(--muted);margin-top:2px}
.exc-note{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.exc-last{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.exc-last b{color:var(--fg);font-weight:600}
.exc-last .nw{white-space:nowrap}
.exc-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.exc-last{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exc-f{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border-top:1px solid var(--line);padding-top:12px}
.exc-f .grow{flex:1}
.exc-f .wnow{font-size:34px}
.exc-f .su.rst{border:0;padding:0 2px;height:32px;color:var(--muted)}
.exc-f .su.rst svg{color:var(--muted)}
.setrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:-2px}
.setup{display:flex;flex-wrap:wrap;gap:6px;text-align:left;justify-self:start}
.su.rst{color:var(--fg)}
.su.rst .rdot{color:var(--muted);margin:0 1px}
.su.rst svg{width:16px;height:16px}
.su{height:30px;display:inline-flex;align-items:center;gap:3px;border:1.5px solid var(--line);border-radius:999px;padding:0 10px 0 7px;font-size:13px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.su svg{width:18px;height:18px;color:var(--muted);flex:none}
.sun{min-width:14px;text-align:center;font-size:17px;font-weight:600;color:var(--muted);line-height:1}
.su .ar{color:var(--accent);font-weight:600}
.su.add{border-style:dashed;color:var(--muted);font-weight:600}
.su-note{font-size:13px;color:var(--muted);white-space:pre-line}
.surow{display:flex;align-items:center;gap:4px;min-height:52px;border-bottom:1px solid var(--line)}
.surow .ti{width:34px;height:34px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none;margin-right:6px}
.surow .ti svg{width:20px;height:20px}
.surow .nm{flex:1;min-width:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{width:32px;height:34px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:17px;font-weight:600;flex:none}
.sub svg{width:16px;height:16px}
.sub.on{background:var(--accent-soft);color:var(--accent)}
.sub.x{background:transparent}
.surow input{width:36px;height:34px;border:0;background:transparent;text-align:center;font:inherit;font-size:17px;font-weight:600;color:var(--fg);padding:0}
.suadd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 0 4px}
.suadd .su{height:60px;flex-direction:column;justify-content:center;gap:4px;border-radius:var(--r);padding:0;font-weight:600}
.suadd .su svg{width:22px;height:22px;color:var(--fg)}
.sulbl{font-size:13px;font-weight:600;color:var(--muted);padding-top:12px}
.wbtn{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;text-align:right}
.wbig{font:600 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.wbig small{font:600 13px var(--f-body);color:var(--muted);margin-left:3px}
.wsub{font-size:12px;color:var(--muted);font-weight:600}
.exc .pmini{margin-left:0;min-height:0}
.wcol{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.wnow{font:600 34px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em;color:var(--fg);padding:0;white-space:nowrap}
.wnow small{font:600 13px var(--f-body);color:var(--muted);margin-left:3px}
.circs{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px}
.cw{display:flex;flex-direction:column;align-items:center;gap:1px}
.circ{width:52px;height:52px;border-radius:50%;white-space:nowrap;letter-spacing:-.01em;border:2px solid var(--ring);display:grid;place-items:center;font-weight:600;font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:background .12s,border-color .12s,color .12s}
/* logged: solid blue; warm-ups: dashed grey */
.circ.hit{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
/* logged under the rep range: looks the same as any logged set */
.circ.miss{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.circ.warm{border-style:dashed;border-color:var(--ring);color:var(--muted)}
.circ.warm.wdone{border-style:solid;border-color:var(--surface-2);background:var(--surface-2);color:var(--fg);font-weight:600}
/* personal records still count in History; on the circles the +N / ↑ markers say it */
.circ.add{border-style:dashed;font-weight:400}
/* next set to do, once rest is over: blue ring, inside slowly fills and empties */
.circ.nxt{border-color:var(--accent);color:var(--fg);position:relative;isolation:isolate}
/* the breathing is a separate layer fading in and out (Safari repaints this reliably) */
.circ.nxt::before{content:'';position:absolute;inset:0;border-radius:50%;background:var(--accent);opacity:0;z-index:-1;animation:nxt 2.2s ease-in-out infinite;pointer-events:none}
@keyframes nxt{0%,100%{opacity:0}50%{opacity:.3}}
.cdiv{width:1px;height:52px;background:var(--line);flex:none}
.clbl{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;line-height:16px;min-height:28px;padding:4px 2px;border-radius:var(--r-in);white-space:nowrap}
.clbl.warm{color:var(--muted)}

.exc-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.exc-f .pill{height:26px}
.upbtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:10px 10px 10px 14px;border-radius:var(--r);background:var(--accent-soft);background:color-mix(in srgb, var(--accent) 16%, var(--surface));color:var(--fg);text-align:left}
.upbtn .ic{color:var(--accent);flex:none}
.uppill{position:absolute;top:0;right:0;z-index:2;display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 14px 0 11px;border-radius:0 12px 0 12px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ssi{position:relative}
.ssi .uppill{top:-12px;right:-14px;border-radius:0 0 0 12px}
.exc-h:has(.uppill){padding-top:12px}
.uppill .ic{width:15px;height:15px;flex:none}
.uppill.dn{background:var(--surface-2);color:var(--fg)}
.uppill:not(.dn){isolation:isolate}
.uppill:not(.dn)::before{content:'';position:absolute;inset:-3px;border-radius:inherit;background:var(--accent);filter:blur(6px);opacity:.15;z-index:-1;animation:upglow 2.2s ease-in-out infinite;pointer-events:none}
@keyframes upglow{0%,100%{opacity:.15;transform:scale(.97)}50%{opacity:.75;transform:scale(1.08)}}
.upbtn .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.upbtn b{font-size:15px;font-weight:600}
.upbtn .btn{flex:none;height:34px}
.upbtn .grow span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upbtn.on{background:var(--surface)}
.upbtn.on > .ic{color:var(--muted)}
.upact{font-size:13px;font-weight:600;color:var(--accent);flex:none}
.wnow.wup{color:var(--win)}
.wnow.wdown{color:var(--danger)}
.warr{font-size:22px;margin-right:2px;vertical-align:3px}
.clbl.wup{color:var(--win)}
.clbl.wdown{color:var(--danger)}
.circ.beat{position:relative;overflow:visible}
.circ.beat::after{content:attr(data-beat);position:absolute;right:-8px;top:-8px;min-width:24px;height:20px;padding:0 5px;border-radius:var(--r);background:var(--win);color:var(--win-ink);font:600 12px/20px var(--f-body);text-align:center;box-shadow:0 0 0 2px var(--surface);z-index:1}
.circ.beat.lost::after{background:var(--danger);color:#FFFFFF}
.sx-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sx-grid.one{grid-template-columns:1fr}
.sx{position:relative;display:block}
.sx input{width:100%;height:64px;border:0;border-radius:var(--r);background:var(--surface-2);text-align:center;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 44px;-webkit-appearance:none;appearance:none}
.sx span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600;color:var(--muted);pointer-events:none}
.sx-row{display:flex;justify-content:center;gap:4px;margin-top:6px}
.sxs{display:flex;gap:8px;margin-bottom:10px}
.sxgrid{margin-bottom:14px}
.sxgrid.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.sxgrid button{height:48px;font-size:17px}
.sxs .sx input{height:52px;font-size:20px}
.sxs .sxb{height:52px}
.sxs .sx{flex:1;min-width:0}
.sxb{width:56px;height:64px;border-radius:var(--r);background:var(--surface-2);font-size:22px;font-weight:400;flex:none}
.sxb:active{transform:scale(.96)}
.sxfoot{display:flex;gap:10px;margin-top:4px}
.sxfoot .btn{flex:1;height:52px;border-radius:var(--r);font-size:17px}
.sxfoot .sxundo{flex:none;width:56px;padding:0}
.sxhd{display:flex;gap:8px}
.sxun{width:44px;height:44px;border-radius:var(--r);background:var(--surface-2);color:var(--fg)}
.sxdel{width:44px;height:44px;border-radius:var(--r);background:var(--danger);color:#FFFFFF}
.hint{font-size:13px;color:var(--muted);margin:14px 4px 0}

/* Rest bar */
.restbar{position:absolute;left:0;right:0;top:0;z-index:4;background:var(--accent-soft);background:color-mix(in srgb, var(--accent) 38%, var(--surface));color:var(--accent-ink);display:flex;flex-direction:column;justify-content:center;overflow:hidden;padding:env(safe-area-inset-top, 0px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));animation:restin .2s ease-out}
@keyframes restin{from{opacity:0}}
.restbar .rb-row{position:relative;z-index:1;flex:none;height:48px;display:flex;align-items:center;gap:8px;max-width:560px;width:100%;margin:0 auto}
.rb-t{flex:1;display:flex;align-items:baseline;gap:10px;min-width:0}
.rb-min{width:40px;height:40px;border-radius:var(--r);display:grid;place-items:center;flex:none;color:inherit;background:var(--accent);background:color-mix(in srgb, var(--accent-ink) 16%, transparent);margin-right:4px}
.rb-min .ic{width:22px;height:22px}
.rb-t b{font:600 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.rb-t span{font-size:13px;font-weight:600;letter-spacing:.06em;opacity:.75}
.rb-b{height:40px;padding:0 16px;border-radius:var(--r);background:var(--accent-ink);color:var(--accent);font-size:17px;font-weight:600;flex:none}
/* the blue panel itself drains from right to left as rest runs out */
.rb-track{position:absolute;inset:0;background:transparent}
.rest-fill{height:100%;background:var(--accent);transform-origin:left;transition:transform .5s linear}
.rest-time{font:600 34px/1 var(--f-display);font-variant-numeric:tabular-nums;flex:1}
/* full-screen rest: the screen fills with blue that drains as rest runs out, readable from across the room */
.rb-big{display:none}
.restbar.full{top:0!important;bottom:0;height:auto!important;padding:0;background:rgba(0,0,0,.86);color:#fff}
.restbar.full .rb-row,.restbar.full .rb-track{display:none}
.restbar.full .rb-big{display:flex;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center}
.rb-lvl{position:absolute;left:0;right:0;bottom:0;height:100%;background:var(--accent);transition:height 1s linear}
.rb-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:0 24px;transform:translateY(-6vh)}
.rb-lab{font-size:22px;font-weight:600;letter-spacing:.18em}
.rb-num{font:600 150px/.9 var(--f-display);font-variant-numeric:tabular-nums}
.rb-next{font-size:17px;font-weight:600;opacity:.92;min-height:24px}
.rb-btns{position:absolute;left:0;right:0;bottom:max(40px, calc(env(safe-area-inset-bottom, 0px) + 16px));display:flex;justify-content:center;gap:12px}
.rb-bb{height:52px;min-width:96px;padding:0 26px;border-radius:var(--r);background:rgba(255,255,255,.2);color:#fff;font-size:17px;font-weight:600}
.rb-t{cursor:pointer}
/* live workout: two exercises per screen, swiping moves one exercise at a time */
#wk.paged #wkscroll{scroll-snap-type:y mandatory;scroll-padding-top:4px;scrollbar-width:none}
#wk.paged #wkscroll::-webkit-scrollbar{display:none;width:0;height:0}

#wk.paged #wkb > .exc{scroll-snap-align:start;scroll-snap-stop:always;min-height:var(--ch, 280px);align-content:space-between;padding:16px}
#wk.paged #wkb > .exc.ssg{min-height:var(--fh, 560px)}

.wrail{display:none}
#wk.paged .wrail{display:flex;position:absolute;right:max(3px, env(safe-area-inset-right, 0px));top:50%;transform:translateY(-30%);flex-direction:column;gap:6px;z-index:3;pointer-events:none}
.wrail i{width:5px;height:16px;border-radius:3px;background:var(--surface-2);transition:height .2s,background .2s}
.wrail i.dn{background:var(--muted)}
.wrail i.on{background:var(--accent);height:30px}
/* Plate calculator */
.calc-target{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
.calc-target input{flex:1;min-width:0;height:56px;border:0;border-radius:var(--r);background:var(--surface-2);text-align:center;font:600 34px var(--f-display);font-variant-numeric:tabular-nums}
.calc-target .btn{height:56px;width:56px;padding:0;font-size:22px}
.wtcmp{display:flex;align-items:center;justify-content:center;gap:8px;min-height:30px;margin:8px 0 2px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.wtcmp:empty{display:none}
.wtd{height:24px;padding:0 9px;border-radius:999px;display:inline-flex;align-items:center;font-size:13px;font-weight:600}
.wtd.up{background:var(--win);color:var(--win-ink)}
.wtd.down{background:var(--danger);color:#fff}
.wtd.same{background:var(--surface-2);color:var(--muted)}
.pviz{display:flex;align-items:center;height:118px;margin:14px 0 4px;overflow-x:auto;padding-inline:2px}
.pviz .base{flex:none;width:30px;height:16px;background:var(--p-gray);border-radius:3px 0 0 3px;opacity:.8}
.pviz .collar{flex:none;width:8px;height:34px;background:var(--p-gray);border-radius:2px}
.pviz .plate{flex:none;width:var(--w);height:var(--h);border-radius:4px;margin-left:2px;display:grid;place-items:center;font:600 11px var(--f-body);color:#fff;writing-mode:vertical-rl;transform:rotate(180deg)}
.pviz .plate.light{color:#1B1D22;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.pviz .sleeve{flex:1;min-width:24px;height:12px;background:var(--p-gray);opacity:.55;border-radius:0 3px 3px 0}
.calc-out{font-size:15px;line-height:1.5}
.fig{display:block;height:100%;width:auto}
.fig rect,.fig circle{fill:var(--body)}
.fig .hl{fill:var(--accent)}
.thumb{width:44px;height:44px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none;padding:4px 0}
.thumb.lg{width:64px;height:64px;padding:6px 0}
.bmap{display:flex;gap:3px;flex:none;height:58px}
.bmap.lg{height:132px;justify-content:center;gap:18px}
.rc-row{display:flex;gap:14px;align-items:flex-start}
.rrow{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px}
.cf-card{display:flex;flex-direction:column;gap:3px;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:14px;margin-bottom:12px}
.cf-card .hero-tag,.cf-card .hero-sub{color:inherit;opacity:.75}
.cf-card .hero-bar{margin-top:8px}
.cf-clk{font:600 34px/1 var(--f-display);font-variant-numeric:tabular-nums;margin:2px 0}
.cf-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cf-btns .btn{height:48px;font-size:17px}
.cf-btns .ic{width:18px;height:18px}
.cf-del{color:var(--danger)}
.ic.solid path{fill:currentColor}
.hero-bar i{display:block;height:100%;background:var(--accent-ink);border-radius:3px}
.exh .thumbbtn{margin-right:4px;flex:none;border-radius:8px}
.thumbbtn{flex:none;border-radius:8px}
.thumb.photo{padding:0;overflow:hidden;background:#FFFFFF;width:48px;height:48px;position:relative}
.thumb.photo img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.photo img.f2,.bigflip img.f2{position:absolute;inset:0;opacity:0;animation:flip 1.6s steps(1, end) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}100%{opacity:1}}
.bigflip{position:relative;border-radius:var(--r);overflow:hidden;background:#FFFFFF;margin-bottom:10px}
.bigflip img{width:100%;height:auto;display:block}
.bigflip img.f2{height:100%;object-fit:cover}
.frames{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.frames img{width:100%;height:auto;border-radius:var(--r);background:#FFFFFF;display:block}
.credit{font-size:12px;color:var(--muted);margin:0 0 12px}
.pstrip .pviz.sm{width:100%;max-width:none;height:58px}
.pstrip .pviz.sm .sleeve{height:7px}
.pviz .plate.edge{box-shadow:inset 0 0 0 1px rgba(128,128,128,.55)}
.pmini{margin-left:auto;display:inline-flex;align-items:center;gap:2px;min-height:30px}
.pmini:empty{display:none}
.pm-bar{width:9px;height:6px;background:var(--p-gray);border-radius:2px;margin-right:1px}
.pm-p{min-width:22px;padding:0 3px;border-radius:4px;display:grid;place-items:center;font:600 13px/1 var(--f-body);color:#FFFFFF;font-variant-numeric:tabular-nums}
.pm-p.light{color:#1B1D22}
.pm-p.edge{box-shadow:inset 0 0 0 1px rgba(128,128,128,.55)}
.pm-empty{font-size:12px;font-weight:600;color:var(--muted)}
.pb{display:inline-flex;align-items:center;gap:3px}
.pb-pin{height:26px;min-width:34px;padding:0 7px;border-radius:var(--r-in);font:600 13px/26px var(--f-body);font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px rgba(128,128,128,.5);text-align:center}
.pb-add{width:10px;height:22px;border-radius:var(--r-in);background:#C9CDD3;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.pb-kit{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.pb.lg{gap:2px;margin:34px 0 22px;transform:scale(1.7)}
.pb.lg .pb-pin{height:44px;min-width:60px;font-size:20px;line-height:44px;padding:0 12px;border-radius:8px}
.pb.lg .pb-add{width:14px;height:34px;border-radius:var(--r-in)}
.ps-warn{flex:none;font-size:13px;font-weight:600;color:var(--warn);font-variant-numeric:tabular-nums}
.pstrip{display:flex;align-items:center;gap:12px;margin-top:10px;padding:6px 12px 6px 8px;border-radius:var(--r);background:var(--surface-2);min-height:56px}
.pstrip:empty{display:none}
.pviz.sm{height:48px;margin:0;flex:none;width:44%;max-width:170px;overflow:hidden;padding:0}
.pviz.sm .base{width:12px;height:7px}
.pviz.sm .collar{width:4px;height:16px}
.pviz.sm .plate{margin-left:1.5px;border-radius:2px}
.pviz.sm .sleeve{min-width:8px;height:6px}
.ps-txt{min-width:0;display:grid;gap:1px;font-size:15px;line-height:1.25}
.ps-txt b{font-variant-numeric:tabular-nums}
.ps-txt span{font-size:12px}
.warnc{color:var(--warn)}
.calc-out b{font-variant-numeric:tabular-nums}
.warnline{color:var(--warn);font-size:15px;font-weight:600;margin-top:4px}
@media (prefers-reduced-motion: reduce){*:not(.f2),*::before,*::after{animation:none!important;transition:none!important}}
/* ============ Lift design system: one rule per kind of thing, on every screen ============
   Shape   16 for cards and sheets · 12 for controls you press or type in · 8 inside them (pictures, table cells)
           capsules for anything 32 or shorter (chips, bar buttons) · circles for sets, days and round icon buttons
   Type    SF Pro for words, SF Rounded for every figure (weights, reps, clocks, stats)
           34 hero figures · 22 stats · 20 section and sheet titles · 17 titles and body · 15 secondary · 13 labels and chips · 12 fine print
   Colour  black, white and neutral greys only · white (black in light mode) for the next thing to do and what is done
           red only to delete · gold only for more than last time · plates keep their real colours
   Space   16 gutters and card padding · 16 between the rows of a card · 12 between cards · 8 inside a group */
:root{--r:12px;--r-in:8px;--r-card:16px;
  --bg:#F2F2F2;--surface:#FFFFFF;--surface-2:rgba(0,0,0,.065);--fill-3:rgba(0,0,0,.035);
  --line:rgba(0,0,0,.12);--fg:#000000;--muted:rgba(0,0,0,.55);--faint:rgba(0,0,0,.28);--ring:rgba(0,0,0,.28);
  --tint:rgba(0,122,255,.12);--accent-soft:var(--tint);--done:var(--accent);--done-ink:var(--accent-ink);--done-soft:var(--tint);
  --win:#B27B00;--win-ink:#FFFFFF;--gone:#8E8E8E;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
.dark{--bg:#000000;--surface:#161616;--surface-2:rgba(255,255,255,.12);--fill-3:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.14);--fg:#FFFFFF;--muted:rgba(255,255,255,.58);--faint:rgba(255,255,255,.3);--ring:rgba(255,255,255,.26);
  --tint:rgba(10,132,255,.2);--accent-soft:var(--tint);--done:var(--accent);--done-ink:var(--accent-ink);--done-soft:var(--tint);
  --win:#FFD60A;--win-ink:#000000;--gone:#636363}
html.ios,html.ios.dark{--f7-list-inset-border-radius:var(--r-card);--f7-block-inset-border-radius:var(--r-card);--f7-sheet-border-radius:var(--r-card);
  --f7-list-strong-bg-color:var(--surface);--f7-block-strong-bg-color:var(--surface);--f7-list-item-border-color:var(--line);
  --f7-list-item-text-text-color:var(--muted);--f7-list-item-after-text-color:var(--muted);
  --f7-block-title-font-size:20px;--f7-block-title-font-weight:700;--f7-block-title-line-height:24px;--f7-block-title-margin-bottom:10px}

/* ---- bars ---- */
.navbar .link{color:var(--f7-theme-color)}
.navbar .link .ic{width:22px;height:22px}
.navbar .link.wkfin,.navbar .link[data-act="wkSave"]{font-weight:600}
#wk .navbar-bg{background-color:rgba(var(--bar-rgb),.8)}
/* the workout's bar: its name over the running time and how far along you are */
.navbar .title.wkt{overflow:visible}
.wkt-b{display:flex;flex-direction:column;align-items:center;gap:1px;padding:0 6px;max-width:58vw}
.wkt-n{max-width:100%;font-size:16px;font-weight:600;line-height:20px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkt-s{display:flex;gap:5px;font:500 12px/15px var(--f-num);font-variant-numeric:tabular-nums;color:var(--muted)}
.wkt-s i{font-style:normal;color:var(--faint)}
#clock.paused{color:var(--accent)}

/* ---- cards ---- */
#wkb{padding:4px 16px 140px}
.exc,.exb,#wk.paged #wkb > .exc,#wk.paged #wkb > .exc.ssg{background:var(--surface);border:0;border-radius:var(--r-card);padding:16px;margin-top:12px;box-shadow:none;min-height:0;align-content:start}
.exc,.exc.ssg,.ssi{gap:16px}
.exb.ss-join{margin-top:6px}
.nowcard,.calcard{padding:16px}
.mini .in{border-radius:var(--r-card)}
.cf-card{border-radius:var(--r);padding:14px 16px;background:var(--surface-2);color:var(--fg)}
.cf-card .hero-tag{color:var(--accent);opacity:1}
.cf-card .hero-sub{color:var(--muted);opacity:1;font-weight:400}
.cf-card .hero-bar,.nowcard .nc-bar{height:6px;border-radius:3px;background:var(--surface-2);margin:12px 0 0}
.cf-card .hero-bar i{background:var(--accent)}
.nowcard .nc-bar{margin-bottom:16px}
.cf-btns .ic,[data-act="cfSave"] .ic{display:none}
.cf-btns,.nowcard .nc-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---- the top row of a card: picture, name, one line under it, a round "more" button ---- */
.exc-h,.exh{display:flex;gap:12px;align-items:center}
.thumb,.thumb.photo,.list .item-media .thumb,.list .item-media .thumb.photo{width:44px;height:44px;border-radius:var(--r-in)}
.thumb.photo{position:relative}
.thumb.photo::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px rgba(128,128,128,.35);pointer-events:none}
.thumbbtn,.exh .thumbbtn{border-radius:var(--r-in);margin:0}
.thumb.lg{width:64px;height:64px}
.exc-t{padding-top:0}
.exc-n,.exname,.xrow .nm,.nowcard .nc-name{font-size:17px;font-weight:600;line-height:22px;color:var(--fg);letter-spacing:-.01em}
.exc-last{font-size:13px;font-weight:400;line-height:18px;color:var(--muted);margin-top:1px}
.exc-last b{font-weight:600;color:var(--fg)}
.xrow .meta,.nowcard .nc-sub,.wpg-date,.hrow-lines,.note,.sh-sub{font-size:15px;font-weight:400;color:var(--muted);line-height:1.35}
.exc-more,.exh .icon-btn{width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;flex:none}
.exc-more .ic,.exh .icon-btn .ic{width:20px;height:20px}
.exc-more:active,.exh .icon-btn:active{opacity:.6}
.streak{border-top:.5px solid var(--line);padding-top:12px}
.surow,.xrow{border-bottom:.5px solid var(--line)}

/* ---- the load: the weight for the set you're on, and what goes on the bar ---- */
.exc-w{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px}
.wnow,.exc-w .wnow{font:700 34px/36px var(--f-num);letter-spacing:-.02em;color:var(--fg)}
.wnow small{font:600 15px var(--f-num);color:var(--muted);margin-left:3px;letter-spacing:0}
.wnow.wup{color:var(--win)}
.wnow.wup small{color:inherit;opacity:.7}
.wnow.wdown{color:var(--fg)}
.wnow.none{color:var(--faint)}
.wnow.none small{color:var(--faint)}
.warr{font-size:20px;margin-right:3px;vertical-align:5px}
.wdown .warr{color:var(--muted)}
.exc .pmini,.pmini{margin-left:auto;gap:3px;min-height:0}
.pm-bar{width:10px;height:5px;border-radius:2px;background:var(--faint);margin-right:1px}
.pm-p{min-width:24px;padding:0 4px;border-radius:5px;font:700 12px/1 var(--f-num)}
.pm-p.edge,.pviz .plate.edge,.invp.edge{box-shadow:inset 0 0 0 .5px rgba(128,128,128,.6)}
.pm-empty{font-size:13px;font-weight:400;color:var(--muted)}
.ps-warn{font:600 13px var(--f-num);margin-left:4px}

/* ---- sets: a filled circle each. Grey to do, ringed blue next, solid blue done; warm-ups are outlines ---- */
.circs{--cs:clamp(40px, calc((100vw - 74px - (var(--n, 5) - 1) * 8px) / var(--n, 5)), 56px);gap:8px;align-items:flex-start}
.cw{gap:2px;width:var(--cs)}
.circ{width:var(--cs);height:var(--cs);border:0;background:var(--surface-2);color:var(--muted);font:600 calc(var(--cs) * .36)/1 var(--f-num);letter-spacing:0;box-shadow:none}
.circ.hit,.circ.miss{background:var(--accent);color:var(--accent-ink)}
.circ.warm{background:none;box-shadow:inset 0 0 0 1.5px var(--ring);color:var(--muted)}
.circ.warm.wdone{background:rgba(var(--accent-rgb),.5);box-shadow:none;color:var(--accent-ink)}
.circ.nxt{background:var(--tint);box-shadow:inset 0 0 0 2px var(--accent);color:var(--fg)}
.circ.nxt::before{animation-name:nxt2}
@keyframes nxt2{0%,100%{opacity:0}50%{opacity:.22}}
.circ.add{background:var(--fill-3);box-shadow:none;color:var(--muted);font-weight:400;font-size:calc(var(--cs) * .42)}
.circ:active{transform:scale(.94)}
.cdiv{width:1px;height:20px;margin-top:calc((var(--cs) - 20px) / 2);background:var(--line)}
.clbl{width:100%;min-height:22px;padding:2px 0 4px;border-radius:0;font:500 12px/16px var(--f-num);color:var(--muted);text-align:center;overflow:hidden}
.clbl:empty{display:none}
.circ .nil{width:14px;height:2px;border-radius:1px;background:var(--faint)}
.clbl.wup{color:var(--win)}
.clbl.wdown,.clbl.pr{color:var(--muted)}
.circ.beat::after{right:-5px;top:-5px;min-width:22px;height:18px;padding:0 5px;border-radius:999px;background:var(--win);color:var(--win-ink);font:700 11px/18px var(--f-num);box-shadow:0 0 0 2px var(--surface)}
.circ.beat.lost::after{background:var(--gone);color:#FFFFFF}

/* ---- chips: every small tappable capsule (rest time, go heavier, rack setup, muscle filters) ---- */
.exc-c,.setrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:0}
.su,.su.rst,.uppill,.mchip,.wtd{position:static;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border:0;border-radius:999px;background:var(--surface-2);color:var(--fg);font:600 13px/1 var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.setup{display:inline-flex;gap:8px;flex-wrap:wrap}
.su svg,.su.rst svg,.uppill .ic{width:15px;height:15px;color:var(--muted)}
.su .sun{font-size:13px;color:var(--muted)}
.su .ar{color:var(--accent)}
.su.add,.su.add svg{color:var(--accent)}
.su.rst .rdot{color:var(--faint);margin:0 1px}
.su-note{font-size:13px;color:var(--muted)}
.uppill{background:var(--tint);color:var(--accent)}
.uppill .ic{color:var(--accent)}
.uppill::before{display:none!important}
.uppill.dn{background:var(--surface-2);color:var(--fg)}
.uppill.dn .ic{color:var(--muted)}
.mchip{font-size:15px;font-weight:400;padding:0 13px;height:32px}
.mchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.wtd.up{background:var(--win);color:var(--win-ink)}
.wtd.down,.wtd.same{background:var(--surface-2);color:var(--muted)}
.suadd .su{height:64px;border-radius:var(--r);flex-direction:column;justify-content:center;gap:6px;padding:0}
.suadd .su svg{width:22px;height:22px;color:var(--fg)}

/* ---- supersets: two lifts in one card, a hairline between them ---- */
.ss-head{font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--accent);margin-bottom:-4px}
.ss-head span{color:var(--muted);font-weight:400}
.ss-link{height:1px;margin:0}
.ss-link::before{border-top:.5px solid var(--line)}
.ss-link .ic{display:none}
.ssb{top:-5px;left:-5px;min-width:18px;height:18px;border-radius:50%;font:700 11px/1 var(--f-num)}

/* ---- figures ---- */
.nowcard .nc-clock,.bigline h2,.cf-clk,.calc-target input{font:700 34px/1.1 var(--f-num);letter-spacing:-.02em}
.bigline h2 small{font:400 17px var(--f-body);color:var(--muted);margin-left:4px;letter-spacing:0}
.stat .v,.wpg-stats .v{font:700 22px/1.2 var(--f-num);letter-spacing:-.01em}
.stat .k,.wpg-stats .k{font-size:13px;font-weight:400;color:var(--muted)}
.wpr-big{font:600 17px/1.3 var(--f-num)}
.wpr-big small{font:400 15px var(--f-body)}
.reptable b{font:600 17px var(--f-num)}
.cal .d,.num,.restgrid button,.sxgrid button,.mini .t,.navbar .right .navtxt,.xrow .rt,.mbar .n,.prev{font-family:var(--f-num)}
.stats,.streak,.wpg-stats{text-align:center}
.stats.four .stat{display:flex;flex-direction:column-reverse}

/* ---- labels: small grey sentence-case text, never uppercase ---- */
.field > span,.wtime span,.sulbl,.grouphead,.srow.head,.eyebrow,.cal .dow,.reptable span{font-size:13px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted)}
.nowcard .nc-tag,.cf-card .hero-tag{font-size:15px;font-weight:600;letter-spacing:0;text-transform:none}
.sh-title h3{font-size:20px;font-weight:700;letter-spacing:-.01em}
.calhead h3{font-size:17px;font-weight:600}
.block-title .bt-link{font-size:17px;font-weight:400}

/* ---- tags: small tinted words, not tappable ---- */
.tagpill,.prtag,.sschip{display:inline-block;border:0;border-radius:6px;padding:1px 6px;background:var(--tint);color:var(--accent);font-size:12px;font-weight:600;line-height:16px;letter-spacing:0;text-transform:none;font-style:normal}

/* ---- buttons: 50 tall and filled for the main action, tinted for the others, plain red text to delete ---- */
.btn{height:50px;padding:0 16px;border-radius:var(--r);font-size:17px;font-weight:600}
.btn.sm{height:32px;padding:0 14px;border-radius:999px;font-size:15px}
.btn.sec,.rb-min{background:var(--tint);color:var(--accent)}
.btn.sec.danger,.btn.sec.cf-del{background:rgba(255,59,48,.14);color:var(--danger)}
.btn.ghost{height:44px;background:none;color:var(--accent);font-weight:400}
.btn.ghost.danger{color:var(--danger)}
.btn .ic{width:18px;height:18px}
.wk-actions{gap:4px;margin-top:16px}
.icon-btn,.icon-btn.sm,.sxun,.sxdel,.calhead .icon-btn{width:36px;height:36px;border-radius:50%;background:none;color:var(--accent);display:grid;place-items:center}
.sxdel{color:var(--danger)}
.addset{height:44px;margin-top:4px;background:none;color:var(--accent);font-size:17px;font-weight:400;border-radius:var(--r)}
.calc-target .btn{width:56px;height:56px;padding:0;font-size:22px;font-weight:400}
.calc-target input{height:56px;border-radius:var(--r)}
.list-button{font-size:17px}

/* ---- fields and pick-a-value grids ---- */
.inp,.title-in{border-radius:var(--r);font-size:17px}
.inp{height:48px;padding:0 14px}
textarea.inp{height:96px;padding:12px 14px}
.title-in{height:50px;margin-top:16px;padding:0 16px;background:var(--surface);font:600 17px var(--f-body)}
.wtime{margin-top:12px}
.wtime .inp{background:var(--surface);font-size:15px;padding:0 10px}
.num{height:36px;border-radius:var(--r-in);font-size:17px;font-weight:600}
.stype,.chk,.sub,.surow .ti{border-radius:var(--r-in)}
.srow{border-radius:var(--r-in)}
.srow.done{background:none}
.done .num{background:var(--surface-2)}
.restgrid button,.sxgrid button{height:50px;border-radius:var(--r);font-size:17px;font-weight:600}
.seg{border-radius:10px;padding:2px}
.seg button{height:30px;border-radius:var(--r-in);font-size:13px}
.search{height:38px;border-radius:var(--r);padding:0 10px}
.xrow .tick{border-radius:50%}

/* ---- sheets ---- */
.lift-sheet{border-radius:var(--r-card) var(--r-card) 0 0}
.lift-sheet .sheet-modal-inner::before{content:'';display:block;width:36px;height:5px;border-radius:3px;background:var(--faint);margin:6px auto 0}
#sheet{padding-top:2px}

/* ---- rest timer: the same shapes, on blue ---- */
.rb-min{width:32px;height:32px;border-radius:50%;background:var(--on-fill);color:var(--accent-ink)}
.rb-b{height:32px;padding:0 14px;border-radius:999px;font-size:15px;font-weight:600;background:var(--on-fill);color:var(--accent-ink)}
.rb-t b{font:700 28px/1 var(--f-num);letter-spacing:-.01em}
.rb-t span{font-size:13px;font-weight:600;letter-spacing:0;opacity:.8}
.rb-bb{height:50px;min-width:120px;border-radius:var(--r);font-size:17px;font-weight:600;background:var(--on-fill);color:var(--accent-ink)}
.rb-lab{font-size:20px;font-weight:600;letter-spacing:0;opacity:.85}
.rb-num{font:700 136px/.95 var(--f-num);letter-spacing:-.03em}
.rb-next{font-size:17px;font-weight:500}

/* ---- narrow phones: same system, tighter gaps ---- */
@media (max-width:350px){
  .exc-last .nw{white-space:normal}
  .pm-p{min-width:20px;padding:0 2px}
  .srow{grid-template-columns:28px minmax(0,1fr) 84px 52px 38px;gap:4px}
}

/* ---- confirmations and menus: title over one line of detail ---- */
.actions-label{flex-direction:column;gap:3px;padding:14px 20px;text-align:center}
.actions-label b{font-size:13px;font-weight:600;color:var(--fg)}
.actions-label span{font-size:13px;font-weight:400;line-height:18px}

/* ---- settings ---- */
.synckey .item-inner{display:block;padding-top:11px;padding-bottom:11px}
.sk-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sk-top .item-title{color:var(--fg)}
.sk-st{font-size:15px;color:var(--muted);white-space:nowrap}
.ckey{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;font:600 min(17px, 4.2vw)/22px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;color:var(--fg);white-space:nowrap}
.ckey .ic{width:20px;height:20px;color:var(--accent);flex:none}

/* a number you can change sits in a small field, like every other field */
.inp.numin{height:34px;padding:0 10px;border-radius:var(--r-in);background:var(--surface-2);color:var(--fg);text-align:center;font:600 17px var(--f-num)}
/* names are never cut off: they wrap */
.list .item-title,.media-list .item-title{white-space:normal}
.exc-n{white-space:normal;overflow:visible;display:block}
.ss-head{margin-bottom:0}
/* a button that can't be pressed yet is grey, not a dimmer blue */
.btn:disabled,.btn.pri:disabled{opacity:1;background:var(--surface-2);color:var(--faint)}
.wpg-stats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.wpg-stats .gold .v,.wpg-stats .gold .k{color:var(--win)}

/* ---- colour wiring: a colour scheme is only these tokens (plus --bg, --surface, --surface-2, --fill-3, --line above) ---- */
:root{--accent:#000000;--accent-rgb:0,0,0;--accent-ink:#FFFFFF;--on-fill:rgba(255,255,255,.18);--tint-a:.08;--bar-rgb:242,242,242;--tab-rgb:248,248,248}
.dark{--accent:#FFFFFF;--accent-rgb:255,255,255;--accent-ink:#000000;--on-fill:rgba(0,0,0,.1);--tint-a:.14;--bar-rgb:0,0,0;--tab-rgb:14,14,14}
html.ios,html.ios.dark{--tint:rgba(var(--accent-rgb),var(--tint-a));--accent-soft:var(--tint);--done-soft:var(--tint);--gold:var(--accent);
  --f7-theme-color:var(--accent);--f7-theme-color-rgb:var(--accent-rgb);--f7-page-bg-color:var(--bg);--f7-bars-bg-color-rgb:var(--tab-rgb);--f7-navbar-bg-color-rgb:var(--bar-rgb);
  --f7-toggle-active-color:var(--accent);--f7-sheet-bg-color:var(--surface)}
html,body{background:var(--bg)}
.restbar,.restbar.full{color:var(--accent-ink)}
.cal .d.on,.xrow[aria-pressed="true"] .tick,.restgrid button[aria-pressed="true"],.sxgrid button[aria-pressed="true"],.chk.on,.ssb{color:var(--accent-ink)}
.toggle input[type=checkbox]:checked + .toggle-icon{background:var(--accent)}
.xrow .nm{display:block;white-space:normal;overflow:visible}

/* ---- black and white: the pieces that assumed a coloured accent ---- */
html.ios,html.ios.dark{--f7-toggle-active-knob-bg-color:var(--accent-ink)}
.done .chk{background:var(--accent);color:var(--accent-ink)}
.dark .seg button[aria-pressed="true"]{background:rgba(255,255,255,.22)}
input,textarea{caret-color:var(--fg)}
.check-row input{accent-color:var(--fg)}
/* the rest clock sits dead centre: its label above and the next-set line below take the same room */
.rb-c{transform:none;gap:12px}
.rb-lab{line-height:24px;height:24px}
.rb-next{line-height:24px;height:24px;min-height:24px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
/* the in-progress bar floats 8 above the tab bar (the tab bar is 50 tall plus the home-bar inset) */
.mini{bottom:calc(var(--f7-tabbar-icons-height, 50px) + var(--f7-safe-area-bottom, 0px) + 8px)}
.has-mini .page-content{padding-bottom:calc(var(--f7-tabbar-icons-height, 50px) + var(--f7-safe-area-bottom, 0px) + 76px)}
/* row arrows and ticks sit in the vertical middle of the row */
.media-list .item-after .ckmark{position:absolute;top:50%;right:calc(var(--f7-list-chevron-icon-area) + var(--f7-list-item-padding-horizontal) + 6px);transform:translateY(-50%);display:grid;place-items:center}
.media-list.chevron-center .item-title-row{position:static}
/* the rest clock is centred in the space you can see: between the status bar and the +30 / Skip buttons */
.restbar.full .rb-big{padding-top:var(--f7-safe-area-top, 0px);padding-bottom:calc(max(40px, var(--f7-safe-area-bottom, 0px) + 16px) + 50px)}
.rb-btns{bottom:max(40px, calc(var(--f7-safe-area-bottom, 0px) + 16px))}
/* tight tracking trims space after the last digit too, which pushed the digits right of centre; give that space back */
.rb-num::after{content:'';display:inline-block;width:.03em}

/* go heavier sits right beside the weight it changes: a small gold capsule (grey when it suggests going lighter) */
.exc-w{justify-content:flex-start;flex-wrap:wrap;row-gap:8px;gap:8px}
.exc-w .uppill{height:28px;padding:0 10px 0 8px;gap:3px;background:var(--win);color:var(--win-ink);font:700 14px/1 var(--f-num)}
.exc-w .uppill .ic{width:14px;height:14px;color:var(--win-ink)}
.exc-w .uppill.dn{background:var(--surface-2);color:var(--fg)}
.exc-w .uppill.dn .ic{color:var(--muted)}
.exc-w .uppill:active{opacity:.7}
/* full-screen rest: the level drains down the screen; the clock, labels and buttons flip colour where it has passed,
   so they are always black on white or white on black */
.restbar.full{background:#000000}
html:not(.dark) .restbar.full{background:#FFFFFF}
.restbar.full .rb-c,.restbar.full .rb-btns{mix-blend-mode:difference;color:#FFFFFF}
.restbar.full .rb-bb{background:#2E2E2E;color:#FFFFFF}

/* ---- hands-free: always white on black, sized to be read from across the room ---- */
.hf{position:absolute;inset:0;z-index:5000;background:#000000;color:#FFFFFF;overflow:hidden;--hft:calc(var(--f7-safe-area-top, 0px) + 10px)}
#hfc{position:absolute;overflow:hidden;background:#111111}
#hfv,#hfo{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
#hfv{object-fit:cover}
#hfo{z-index:2;pointer-events:none}
.hf.full #hfc{inset:0;width:100%;height:100%}
.hf.pip #hfc{z-index:3;top:var(--hft);right:16px;width:84px;height:112px;border-radius:var(--r);box-shadow:0 0 0 .5px rgba(255,255,255,.3)}
#hfb{position:absolute;inset:0}
.hf-x{position:absolute;top:var(--hft);left:16px;width:36px;height:36px;border-radius:50%;background:rgba(60,60,60,.72);color:#FFFFFF;display:grid;place-items:center;z-index:2}
.hf-x .ic{width:18px;height:18px}
.hf-mid{position:absolute;left:20px;right:20px;top:var(--f7-safe-area-top, 0px);bottom:calc(var(--f7-safe-area-bottom, 0px) + 76px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hf-name{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:34px}
.hf-label{font:600 22px/28px var(--f-num);color:rgba(255,255,255,.58);margin-top:2px}
.hf-w{font:700 min(112px, 27vw)/1 var(--f-num);letter-spacing:-.04em;margin-top:28px}
.hf-w small{font-size:.3em;font-weight:600;letter-spacing:0;color:rgba(255,255,255,.58);margin-left:6px}
.hf-plates{zoom:1.55;margin:14px 0 0;justify-content:center}
.hf-plates .pm-empty,.hf-plates .ps-warn{color:rgba(255,255,255,.58)}
.hf-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.hf-chip,.hf-chips .su{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.14);color:#FFFFFF;font:600 17px/1 var(--f-num)}
.hf-chips .setup{gap:8px;justify-content:center}
.hf-chips .su svg{width:18px;height:18px;color:rgba(255,255,255,.58)}
.hf-chips .su .ar{color:#FFFFFF}
.hf-chips .su.add{display:none}
.hf-bot{position:absolute;left:20px;right:20px;bottom:calc(var(--f7-safe-area-bottom, 0px) + 20px);display:flex;justify-content:space-between;gap:12px;font:400 17px/22px var(--f-num);color:rgba(255,255,255,.58)}
.hf-top{position:absolute;top:calc(var(--hft) + 2px);left:20px;right:116px}
.hf-tn{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:26px}
.hf-ts{font:400 17px/22px var(--f-num);color:rgba(255,255,255,.58);margin-top:2px}
.hf-num{font:700 min(340px, 78vw, 52vh)/.86 var(--f-num);letter-spacing:-.05em}
.hf-num.two{font-size:min(260px, 62vw, 46vh)}
.hf-num.gold{color:#FFD60A}
.hf-of{font:600 28px/1 var(--f-num);color:rgba(255,255,255,.58);margin-top:18px}
.hf-foot{position:absolute;left:0;right:0;bottom:calc(var(--f7-safe-area-bottom, 0px) + 20px);display:flex;flex-direction:column;align-items:center;gap:10px}
.hf-cap{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;background:rgba(60,60,60,.78);color:#FFFFFF;font-size:17px;font-weight:600;white-space:nowrap}
.hf-cap.on{background:#FFFFFF;color:#000000}
.hf-cap b{width:8px;height:8px;border-radius:50%;background:currentColor}
.hf-br{position:absolute;left:12%;right:12%;top:calc(var(--f7-safe-area-top, 0px) + 64px);bottom:calc(var(--f7-safe-area-bottom, 0px) + 96px);opacity:.45;transition:opacity .2s}
.hf-br.on{opacity:1}
.hf-br i{position:absolute;width:34px;height:34px;border:3px solid #FFFFFF}
.hf-br i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.hf-br i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.hf-br i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.hf-br i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.hf-spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#FFFFFF;animation:hfspin .9s linear infinite}
@keyframes hfspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.hf-spin{animation-duration:2.4s}}
.navbar .link.wkhf{margin-right:2px}
/* "8 logged" with − and + on the rest screen, flipping colour with the level like everything else there */
.rb-log{position:absolute;top:calc(var(--f7-safe-area-top, 0px) + 12px);left:0;right:0;display:flex;align-items:center;justify-content:center;gap:6px;mix-blend-mode:difference;color:#FFFFFF}
.rb-log[hidden]{display:none}
.rb-log button{width:40px;height:40px;border-radius:50%;background:#2E2E2E;color:#FFFFFF;font:600 22px/1 var(--f-body)}
.rb-log span{font:700 20px/1 var(--f-num);padding:0 10px;white-space:nowrap}

/* ---- hands-free with the phone on its side: the screen content turns a quarter, the camera picture stays put (it is a mirror) ---- */
.hf{container-type:size;--it:var(--f7-safe-area-top, 0px);--ib:var(--f7-safe-area-bottom, 0px);--il:0px;--ir:0px;--hft:calc(var(--it) + 10px)}
.hf.rot90{--it:0px;--ib:0px;--il:var(--f7-safe-area-top, 0px);--ir:var(--f7-safe-area-bottom, 0px)}
.hf.rotm90{--it:0px;--ib:0px;--il:var(--f7-safe-area-bottom, 0px);--ir:var(--f7-safe-area-top, 0px)}
#hfb{container-type:size}
.hf.rot90 #hfb,.hf.rotm90 #hfb{inset:auto;top:50%;left:50%;width:100cqh;height:100cqw;transform:translate(-50%, -50%) rotate(90deg)}
.hf.rotm90 #hfb{transform:translate(-50%, -50%) rotate(-90deg)}
.hf-x{left:calc(16px + var(--il))}
.hf-x.hf-rot{left:calc(60px + var(--il))}
.hf-mid{left:calc(20px + var(--il));right:calc(20px + var(--ir));top:var(--it);bottom:calc(var(--ib) + 76px)}
.hf-bot{left:calc(20px + var(--il));right:calc(20px + var(--ir));bottom:calc(var(--ib) + 20px)}
.hf-top{left:calc(20px + var(--il));right:calc(116px + var(--ir))}
.hf-foot{bottom:calc(var(--ib) + 20px)}
.hf-br{top:calc(var(--it) + 64px);bottom:calc(var(--ib) + 96px)}
.hf-w{font-size:min(112px, 27cqw, 24cqh)}
.hf-num{font-size:min(340px, 78cqw, 52cqh)}
.hf-num.two{font-size:min(260px, 62cqw, 46cqh)}
.hf.rot90 .hf-mid,.hf.rotm90 .hf-mid{bottom:calc(var(--ib) + 48px)}
.hf.rot90 .hf-w,.hf.rotm90 .hf-w{margin-top:8px}
.hf.rot90 .hf-plates,.hf.rotm90 .hf-plates{margin-top:8px}
.hf.rot90 .hf-chips,.hf.rotm90 .hf-chips{margin-top:14px}
.hf.rot90 .hf-top,.hf.rotm90 .hf-top{right:calc(144px + var(--ir))}
.hf.rot90 .hf-br,.hf.rotm90 .hf-br{top:56px;bottom:84px;left:22%;right:22%}
/* the small camera picture sits at your top right, wherever that is on the phone */
.hf.pip.rot90 #hfc{top:auto;right:10px;bottom:calc(16px + var(--f7-safe-area-bottom, 0px))}
.hf.pip.rotm90 #hfc{right:auto;left:10px;top:calc(16px + var(--f7-safe-area-top, 0px))}
/* the rest screen turns the same way; its text, buttons and "8 logged" move as one block */
.restbar.full{container-type:size}
.restbar.full .rb-big{padding:0}
.restbar.full .rb-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;container-type:size;mix-blend-mode:difference;color:#FFFFFF;
  --rt:var(--f7-safe-area-top, 0px);--rbm:max(40px, calc(var(--f7-safe-area-bottom, 0px) + 16px));padding-top:var(--rt);padding-bottom:calc(var(--rbm) + 50px)}
.restbar.full .rb-c,.restbar.full .rb-btns,.restbar.full .rb-log{mix-blend-mode:normal}
.restbar.full .rb-btns{bottom:var(--rbm)}
.restbar.full .rb-log{top:calc(var(--rt) + 12px)}
.restbar.full .rb-num{font-size:min(136px, 33cqh)}
.restbar.full .rb-next{max-width:92cqw}
.restbar.full.rot90 .rb-in,.restbar.full.rotm90 .rb-in{inset:auto;top:50%;left:50%;width:100cqh;height:100cqw;transform:translate(-50%, -50%) rotate(90deg);--rt:0px;--rbm:16px}
.restbar.full.rotm90 .rb-in{transform:translate(-50%, -50%) rotate(-90deg)}
.restbar.full.rot90 .rb-lvl,.restbar.full.rotm90 .rb-lvl{top:0;bottom:0;left:0;right:auto;height:100%!important;width:var(--lv, 100%);transition:width 1s linear}
.restbar.full.rotm90 .rb-lvl{left:auto;right:0}

.hf-setw{margin-top:24px}

/* camera view kept big behind the numbers, dimmed so they stay readable; the tracked skeleton is drawn over it */
.hf.see #hfc::after{content:'';position:absolute;inset:0;z-index:1;background:rgba(0,0,0,.55)}
.hf-x.hf-see{left:calc(104px + var(--il))}
.hf-x.hf-see.solo{left:calc(16px + var(--il))}
.hf-x.on{background:#FFFFFF;color:#000000}
/* layering: camera (with its dim layer and skeleton inside) under the text; the small camera box above it so it can be tapped */
#hfc{z-index:0}
#hfb{z-index:1}
.hf.pip #hfc{z-index:3}

/* pushed pages: a round back button that matches the ⋯ beside the title */
.navbar a.link.navb{width:32px;min-width:32px;height:32px;padding:0;margin:0;border-radius:50%;background:var(--surface-2);color:var(--fg);display:grid;place-items:center;line-height:1;overflow:hidden}
.navbar a.link.navb .ic{width:19px;height:19px;stroke-width:2.4}
.navbar a.link.navb.back .ic{transform:translateX(-1px)}
.navbar a.link.navb:active,.navbar a.link.navb.active-state{opacity:.55}
.navbar .left:has(.navb),.navbar .right:has(.navb){margin:0}

/* workout log: one summary card, then the lifts, close together */
.pbody{--f7-block-margin-vertical:12px;--f7-list-margin-vertical:12px;padding-bottom:24px}
.pbody .block-title{margin-top:28px}
.pbody > .block:first-child,.pbody > .list:first-child,.pbody > .wpg > .block:first-child{margin-top:12px}
.navbar-inner:has(.navb) .title{position:absolute!important;left:60px!important;right:60px;margin:0;text-align:center}
.wpg-sum{padding:14px 16px 12px}
.wpg-head{align-items:center}
.wpg-when{display:flex;flex-direction:column;gap:2px;min-width:0}
.wpg-when b{font:600 17px/1.25 var(--f-body);color:var(--fg)}
.wpg-when span{font-size:15px;line-height:1.3;color:var(--muted);font-variant-numeric:tabular-nums}
.wpg-sum .wpg-stats{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.wpg-sum .wpg-stats > div{padding:0 2px}
.wpg-sum .wpg-stats .v{font-size:20px;letter-spacing:-.02em}
.wpg-sum .note{margin-top:12px}

/* coming back: things are where they belong at once, nothing slides into place */
html.booting #app{visibility:hidden}
html.booting *,html.booting *::before,html.booting *::after,
html.noanim .restbar,html.noanim .restbar *,html.noanim .restbar *::before,html.noanim .restbar *::after,html.noanim .mini,html.noanim .mini *{transition:none!important;animation-duration:.001s!important;animation-delay:0s!important}

/* the workout scrolls freely, no snapping one card at a time */
#wk.paged #wkscroll{scroll-snap-type:none}
#wk.paged #wkb > .exc,#wk.paged #wkb > .exc.ssg{scroll-snap-align:none;scroll-snap-stop:normal}
#wk.paged #wkb{padding-bottom:calc(72px + var(--f7-safe-area-bottom, 0px))}

/* it's an app, not a web page: nothing can be highlighted or long-pressed into a Copy menu (typing fields still work) */
html,body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text!important;user-select:text!important}

/* small rest bar: the strip behind the clock and battery stays the app's own background; only the bar below it is filled */
.restbar:not(.full){background:var(--bg)}

/* ---------- plate math ---------- */
// target and cfg.base in display units; respects how many pairs of each plate you own
function calcPlates(target, cfg){
  const sides = cfg.type === 'one' ? 1 : 2, ratio = cfg.ratio || 1, base = cfg.base || 0;
  const want = cfg.logAs === 'felt' ? target * ratio : target;
  const per = (want - base) / sides;
  const stock = inv().map(([p, n]) => [p, sides === 2 ? n : n * 2]);
  let best = {sum:0, used:[]};
  if (per > 1e-9 && stock.length) {
    const rest = stock.map((_, i) => stock.slice(i).reduce((a, [p, n]) => a + p * n, 0));
    let exact = false;
    const dfs = (i, rem, used, sum) => {
      if (sum > best.sum + 1e-9 || (Math.abs(sum - best.sum) < 1e-9 && used.length < best.used.length)) best = {sum, used:used.slice()};
      if (rem < 1e-9) { exact = true; return; }
      if (exact || i >= stock.length || sum + rest[i] < best.sum - 1e-9) return;
      const [p, n] = stock[i];
      for (let k = Math.min(n, Math.floor(rem / p + 1e-9)); k >= 0 && !exact; k--) {
        for (let j = 0; j < k; j++) used.push(p);
        dfs(i + 1, rem - k * p, used, sum + k * p);
        used.length -= k;
      }
    };
    dfs(0, per, [], 0);
  }
  const loaded = base + sides * best.sum;
  const logged = cfg.logAs === 'felt' ? loaded / ratio : loaded;
  return {used:best.used, sides, loaded, felt:loaded / ratio, logged, exact:Math.abs(logged - target) < 1e-6, under:want < base - 1e-9};
}

}

/* ---------- charts ---------- */
function ticks(lo, hi, n=4){

}
function lineChart(pts, fmt){

  const ys = pts.map(p => p.y), tk = ticks(Math.min(...ys), Math.max(...ys), 4), lo = tk[0], hi = tk[tk.length-1];

  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  tk.forEach(v => { s += `<line class="gl" x1="${pl}" x2="${W-pr}" y1="${sy(v)}" y2="${sy(v)}"/><text class="tl" x="${pl-6}" y="${sy(v)+4}" text-anchor="end">${fmt(v)}</text>`; });
  const d = pts.map((p,i) => `${i?'L':'M'}${sx(p.x).toFixed(1)} ${sy(p.y).toFixed(1)}`).join(' ');
  if (pts.length > 1) s += `<path class="ar" d="${d} L${sx(x1).toFixed(1)} ${H-pb} L${sx(x0).toFixed(1)} ${H-pb} Z"/><path class="ln" d="${d}"/>`;
  if (pts.length <= 40) pts.slice(0,-1).forEach(p => { s += `<circle class="dt" cx="${sx(p.x)}" cy="${sy(p.y)}" r="2.6"/>`; });
  const L = pts[pts.length-1];
  s += `<circle class="end" cx="${sx(L.x)}" cy="${sy(L.y)}" r="4.5"/><text class="vl" x="${Math.min(sx(L.x), W-pr)}" y="${Math.max(sy(L.y)-9, 12)}" text-anchor="end">${fmt(L.y)}</text>`;
  const fx = t => fdate(t, {month:'short', day:'numeric'});
  s += `<text class="tl" x="${pl}" y="${H-6}">${fx(x0)}</text>`;
  if (pts.length > 1) s += `<text class="tl" x="${W-pr}" y="${H-6}" text-anchor="end">${fx(x1)}</text>`;
  return s + '</svg>';
}
function barChart(bars, fmt){
  const W = 340, H = 160, pl = 36, pr = 6, pt = 18, pb = 22;
  const mx = Math.max(1, ...bars.map(b => b.v)), tk = ticks(0, mx, 3), hi = tk[tk.length-1];

  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  tk.forEach(v => { s += `<line class="gl" x1="${pl}" x2="${W-pr}" y1="${sy(v)}" y2="${sy(v)}"/><text class="tl" x="${pl-6}" y="${sy(v)+4}" text-anchor="end">${fmt(v)}</text>`; });
  bars.forEach((b,i) => {

    if (i % 3 === 2 || cur) s += `<text class="tl" x="${(x+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${cur ? 'Now' : fdate(b.x,{month:'numeric',day:'numeric'})}</text>`;

  if (L.v > 0) s += `<text class="vl" x="${W-pr}" y="${Math.max(sy(L.v)-6, 12)}" text-anchor="end">${fmt(L.v)}</text>`;

}
