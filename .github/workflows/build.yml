name: build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          sed -i '' "s#__REMOTE__#https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/#" www/index.html
      - run: npx cap sync ios
      - run: |
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document
          ruby ios/live.rb
      - run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          test -d build/Build/Products/Release-iphoneos/App.app
          test -d build/Build/Products/Release-iphoneos/App.app/PlugIns/TrainLive.appex
          test -f build/Build/Products/Release-iphoneos/App.app/rest.wav
      - run: |
          APP=build/Build/Products/Release-iphoneos/App.app
          find "$APP" -path "*/Frameworks/*" \( -name "*.framework" -o -name "*.dylib" \) -maxdepth 3 -print0 | xargs -0 -I{} codesign -f -s - {}
          codesign -f -s - --entitlements ios/App/TrainLive/TrainLive.entitlements "$APP/PlugIns/TrainLive.appex"
          codesign -f -s - --entitlements ios/App/App/App.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q group.com.j7331.train
          codesign -d --entitlements - "$APP/PlugIns/TrainLive.appex" 2>/dev/null | grep -q group.com.j7331.train
      - run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Train.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Train
          path: Train.ipa
          retention-days: 30
