name: build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          sed -i '' "s#__REMOTE__#https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/#" www/index.html
      - run: npx cap sync ios
      - run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          test -d build/Build/Products/Release-iphoneos/App.app
      - run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Train.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Train
          path: Train.ipa
          retention-days: 30
